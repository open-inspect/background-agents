name: Terraform (Cloudflare environment)

# Reusable: provisions one Cloudflare environment root under
# terraform/environments/. Called by terraform-production.yml and
# terraform-staging.yml, which own the triggers. Terraform builds and uploads no
# Worker code; deploy-<environment>.yml does, after this workflow finishes.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment the apply job runs in
        type: string
        required: true
      working-directory:
        description: Terraform root module for the environment
        type: string
        required: true
      plan-environment:
        description: GitHub Environment for the change, secret and plan checks; empty runs them on repository-level settings
        type: string
        default: ""

permissions:
  contents: read

env:
  TF_VERSION: "1.14.8"
  TF_WORKING_DIR: ${{ inputs.working-directory }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.plan-environment }}
    outputs:
      terraform: ${{ steps.classify.outputs.terraform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The workflow also triggers on inputs only a Vercel sandbox snapshot
      # hashes (control-plane and shared sources). Other providers skip the
      # plan and apply for those, and the deploy follows straight away.
      - name: Classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SANDBOX_PROVIDER: ${{ vars.SANDBOX_PROVIDER || secrets.SANDBOX_PROVIDER }}
        run: |
          node scripts/cloudflare-deploy/changes.mjs \
            --base "$BASE_SHA" --head "$HEAD_SHA" --sandbox-provider "$SANDBOX_PROVIDER" \
            | tee -a "$GITHUB_OUTPUT"

  check-secrets:
    name: Check Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: ${{ inputs.plan-environment }}
    outputs:
      has-secrets: ${{ steps.check.outputs.has-secrets }}
    steps:
      - name: Check if secrets are configured
        id: check
        run: |
          # Gate on every credential the plan and apply jobs consume to reach a
          # backend. CLOUDFLARE_ACCOUNT_ID is read with the same `vars || secrets`
          # precedence the init steps use.
          account_id="${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}"
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] &&
            [ -n "${{ secrets.R2_ACCESS_KEY_ID }}" ] &&
            [ -n "${{ secrets.R2_SECRET_ACCESS_KEY }}" ] &&
            [ -n "$account_id" ]; then
            echo "has-secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has-secrets=false" >> $GITHUB_OUTPUT
            echo "::notice::Terraform plan/apply skipped - secrets not configured. See docs/GETTING_STARTED.md for setup instructions."
          fi

  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check-secrets]
    outputs:
      fmt: ${{ steps.fmt.outcome }}
      init: ${{ steps.init.outcome }}
      validate: ${{ steps.validate.outcome }}
      test: ${{ steps.test.outcome }}
      modal-test: ${{ steps.modal_test.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform Init
        id: init
        run: |
          terraform init -backend=false
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: ${{ env.TF_WORKING_DIR }}

      # The environment roots only pass inputs through; the shared module holds
      # the configuration under test. Unfiltered so a new tests/*.tftest.hcl
      # file is gated the moment it lands.
      - name: Terraform Tests
        id: test
        run: |
          terraform init -backend=false
          terraform test
        working-directory: terraform/modules/cloudflare-environment

      - name: Modal module contract tests
        id: modal_test
        run: |
          terraform init -backend=false
          terraform test
        working-directory: terraform/modules/modal-app

  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, validate, check-secrets]
    if: github.event_name == 'pull_request' && needs.check-secrets.outputs.has-secrets == 'true' && needs.changes.outputs.terraform == 'true'
    environment: ${{ inputs.plan-environment }}
    outputs:
      outcome: ${{ steps.plan.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # Capture output as a file, not the wrapper's multiline step outputs.
          terraform_wrapper: false

      - name: Terraform Init
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          terraform init \
            -backend-config="access_key=${{ secrets.R2_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            -backend-config="endpoints={s3=\"https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com\"}"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          # Plan text must not be interpreted as runner workflow commands either.
          command_token="$(openssl rand -hex 32)"
          echo "::stop-commands::$command_token"
          trap 'printf "\n::%s::\n" "$command_token"' EXIT
          terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
        working-directory: ${{ env.TF_WORKING_DIR }}
        continue-on-error: true
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_worker_subdomain: ${{ vars.CLOUDFLARE_WORKER_SUBDOMAIN || secrets.CLOUDFLARE_WORKER_SUBDOMAIN }}
          TF_VAR_r2_media_location: "${{ vars.R2_MEDIA_LOCATION || secrets.R2_MEDIA_LOCATION || 'ENAM' }}"
          TF_VAR_r2_media_bucket_name: ${{ vars.R2_MEDIA_BUCKET_NAME || secrets.R2_MEDIA_BUCKET_NAME }}
          TF_VAR_vercel_api_token: "${{ secrets.VERCEL_API_TOKEN || '000000000000000000000000' }}"
          TF_VAR_vercel_team_id: "${{ vars.VERCEL_TEAM_ID || secrets.VERCEL_TEAM_ID || 'unused' }}"
          TF_VAR_modal_token_id: ${{ secrets.MODAL_TOKEN_ID }}
          TF_VAR_modal_token_secret: ${{ secrets.MODAL_TOKEN_SECRET }}
          TF_VAR_modal_workspace: ${{ vars.MODAL_WORKSPACE || secrets.MODAL_WORKSPACE }}
          TF_VAR_modal_environment: "${{ vars.MODAL_ENVIRONMENT || secrets.MODAL_ENVIRONMENT || 'main' }}"
          TF_VAR_modal_environment_web_suffix: ${{ vars.MODAL_ENVIRONMENT_WEB_SUFFIX || secrets.MODAL_ENVIRONMENT_WEB_SUFFIX }}
          TF_VAR_modal_api_secret: ${{ secrets.MODAL_API_SECRET }}
          TF_VAR_enable_slack_bot: "${{ vars.ENABLE_SLACK_BOT || secrets.ENABLE_SLACK_BOT || 'true' }}"
          TF_VAR_enable_github_bot: "${{ vars.ENABLE_GITHUB_BOT || secrets.ENABLE_GITHUB_BOT || 'false' }}"
          TF_VAR_enable_linear_bot: "${{ vars.ENABLE_LINEAR_BOT || secrets.ENABLE_LINEAR_BOT || 'false' }}"
          TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_provider_accounts_encryption_key: ${{ secrets.PROVIDER_ACCOUNTS_ENCRYPTION_KEY }}
          TF_VAR_deployment_name: ${{ vars.DEPLOYMENT_NAME || secrets.DEPLOYMENT_NAME }}
          TF_VAR_app_name: "${{ vars.APP_NAME || secrets.APP_NAME || 'Open-Inspect' }}"
          TF_VAR_app_icon_url: ${{ vars.APP_ICON_URL || secrets.APP_ICON_URL }}
          TF_VAR_web_platform: "${{ vars.WEB_PLATFORM || secrets.WEB_PLATFORM || 'vercel' }}"
          TF_VAR_web_serverless_region: "${{ vars.WEB_SERVERLESS_REGION || 'iad1' }}"
          TF_VAR_sandbox_provider: "${{ vars.SANDBOX_PROVIDER || secrets.SANDBOX_PROVIDER || 'modal' }}"
          TF_VAR_daytona_api_url: ${{ vars.DAYTONA_API_URL || secrets.DAYTONA_API_URL }}
          TF_VAR_daytona_api_key: ${{ secrets.DAYTONA_API_KEY }}
          TF_VAR_daytona_base_snapshot: ${{ vars.DAYTONA_BASE_SNAPSHOT || secrets.DAYTONA_BASE_SNAPSHOT }}
          TF_VAR_daytona_base_snapshot_memory_gib: "${{ vars.DAYTONA_BASE_SNAPSHOT_MEMORY_GIB || '2' }}"
          TF_VAR_daytona_target: ${{ vars.DAYTONA_TARGET || secrets.DAYTONA_TARGET }}
          TF_VAR_vercel_sandbox_token: ${{ secrets.VERCEL_SANDBOX_TOKEN }}
          TF_VAR_vercel_sandbox_project_id: ${{ vars.VERCEL_SANDBOX_PROJECT_ID || secrets.VERCEL_SANDBOX_PROJECT_ID }}
          TF_VAR_vercel_sandbox_team_id: ${{ vars.VERCEL_SANDBOX_TEAM_ID || secrets.VERCEL_SANDBOX_TEAM_ID }}
          TF_VAR_vercel_sandbox_api_base_url: ${{ vars.VERCEL_SANDBOX_API_BASE_URL || secrets.VERCEL_SANDBOX_API_BASE_URL }}
          TF_VAR_vercel_base_snapshot_id: ${{ vars.VERCEL_BASE_SNAPSHOT_ID || secrets.VERCEL_BASE_SNAPSHOT_ID }}
          TF_VAR_vercel_sandbox_runtime: "${{ vars.VERCEL_SANDBOX_RUNTIME || secrets.VERCEL_SANDBOX_RUNTIME || 'node24' }}"
          TF_VAR_e2b_api_key: ${{ secrets.E2B_API_KEY }}
          TF_VAR_e2b_template_id: ${{ vars.E2B_TEMPLATE_ID || secrets.E2B_TEMPLATE_ID }}
          TF_VAR_e2b_api_url: "${{ vars.E2B_API_URL || secrets.E2B_API_URL || 'https://api.e2b.app' }}"
          TF_VAR_e2b_template_cpu: "${{ vars.E2B_TEMPLATE_CPU || secrets.E2B_TEMPLATE_CPU || '2' }}"
          TF_VAR_e2b_template_memory_mb: "${{ vars.E2B_TEMPLATE_MEMORY_MB || secrets.E2B_TEMPLATE_MEMORY_MB || '4096' }}"
          TF_VAR_boat_api_key: ${{ secrets.BOAT_API_KEY }}
          TF_VAR_boat_api_url: "${{ vars.BOAT_API_URL || secrets.BOAT_API_URL || 'https://boat.dev/api/v1' }}"
          TF_VAR_boat_base_snapshot: ${{ vars.BOAT_BASE_SNAPSHOT || secrets.BOAT_BASE_SNAPSHOT }}
          TF_VAR_boat_org: ${{ vars.BOAT_ORG || secrets.BOAT_ORG }}
          # Documentation site (packages/docs). Leaving DOCS_SITE_ENABLED unset
          # after provisioning the site destroys its Vercel project on apply.
          TF_VAR_docs_site_enabled: "${{ vars.DOCS_SITE_ENABLED || secrets.DOCS_SITE_ENABLED || 'false' }}"
          TF_VAR_docs_custom_domain: ${{ vars.DOCS_CUSTOM_DOMAIN || secrets.DOCS_CUSTOM_DOMAIN }}

      - name: Prepare Plan Comment
        id: prepare_comment
        if: always() && (steps.plan.outcome == 'success' || steps.plan.outcome == 'failure')
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        run: node "$GITHUB_WORKSPACE/scripts/terraform-plan-comment.mjs" plan_output.txt plan_comment.txt "$PLAN_OUTCOME"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Upload Plan Comment
        if: steps.prepare_comment.conclusion == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan-comment
          path: ${{ env.TF_WORKING_DIR }}/plan_comment.txt
          if-no-files-found: error
          retention-days: 1

      - name: Plan Status
        if: always() && steps.plan.outcome == 'failure'
        run: exit 1

  comment:
    name: Comment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate, check-secrets, plan]
    if: always() && !cancelled() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    # No checkout or execution of PR code. Artifacts are read only as comment data.
    steps:
      - name: Post Validation Results
        uses: actions/github-script@v9
        env:
          HAS_SECRETS: ${{ needs.check-secrets.outputs.has-secrets }}
          CHECK_SECRETS_RESULT: ${{ needs.check-secrets.result }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
          FORMAT_OUTCOME: ${{ needs.validate.outputs.fmt }}
          INIT_OUTCOME: ${{ needs.validate.outputs.init }}
          VALIDATE_OUTCOME: ${{ needs.validate.outputs.validate }}
          TEST_OUTCOME: ${{ needs.validate.outputs.test }}
          MODAL_TEST_OUTCOME: ${{ needs.validate.outputs.modal-test }}
          ENVIRONMENT: ${{ inputs.environment }}
        with:
          script: |
            const validationResult = process.env.VALIDATION_RESULT;
            const checkSecretsResult = process.env.CHECK_SECRETS_RESULT;
            const statuses = {
              Format: process.env.FORMAT_OUTCOME,
              Init: process.env.INIT_OUTCOME,
              Validate: process.env.VALIDATE_OUTCOME,
              Tests: process.env.TEST_OUTCOME,
              'Modal module tests': process.env.MODAL_TEST_OUTCOME
            };
            const rows = Object.entries(statuses).map(([step, outcome]) =>
              `| ${step} | ${outcome === 'success' ? 'Success' : outcome || (validationResult === 'skipped' ? 'skipped' : 'Not reported')} |`
            ).join('\n');
            let planNote = '';
            if (checkSecretsResult !== 'success') {
              planNote = '\n\n> **Warning:** Secret availability is unknown because the Check Secrets job did not succeed.';
            } else if (process.env.HAS_SECRETS === 'false') {
              planNote = '\n\n> **Note:** Terraform plan was skipped because secrets are not configured. This is expected for external contributors. See [docs/GETTING_STARTED.md](docs/GETTING_STARTED.md) for setup instructions.';
            } else if (process.env.HAS_SECRETS !== 'true') {
              planNote = '\n\n> **Warning:** Check Secrets completed without a valid secret-availability result.';
            }
            const output = `### Terraform Validation Results (${process.env.ENVIRONMENT})

            **Validation job:** ${validationResult || 'unknown'}
            **Check Secrets job:** ${checkSecretsResult || 'unknown'}

            | Step | Status |
            |------|--------|
            ${rows}
            ${planNote}

            *Pushed by: @${context.actor}, Action: \`${context.eventName}\`*`;

            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              });
            } catch (error) {
              if (error.status === 403) {
                core.notice('Could not post PR comment: GITHUB_TOKEN has read-only access (expected for fork PRs).');
              } else {
                throw error;
              }
            }

      - name: Download Plan Comment
        if: needs.plan.outputs.outcome == 'success' || needs.plan.outputs.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          name: terraform-plan-comment
          path: ${{ runner.temp }}/terraform-plan-comment

      - name: Post Plan Results
        if: needs.plan.outputs.outcome == 'success' || needs.plan.outputs.outcome == 'failure'
        uses: actions/github-script@v9
        env:
          PLAN_COMMENT_PATH: ${{ runner.temp }}/terraform-plan-comment/plan_comment.txt
        with:
          script: |
            const fs = require('node:fs');
            const body = fs.readFileSync(process.env.PLAN_COMMENT_PATH, 'utf8');
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            } catch (error) {
              if (error.status === 403) {
                core.notice('Could not post PR comment: GITHUB_TOKEN has read-only access (expected for fork PRs).');
              } else {
                throw error;
              }
            }

  apply:
    name: Apply
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [changes, validate, check-secrets]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.check-secrets.outputs.has-secrets == 'true' && needs.changes.outputs.terraform == 'true'
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Vercel sandbox snapshot build runs a Node script.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install Modal and Python dependencies
        run: uv sync --frozen
        working-directory: packages/modal-infra

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          terraform init \
            -backend-config="access_key=${{ secrets.R2_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            -backend-config="endpoints={s3=\"https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com\"}"
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_worker_subdomain: ${{ vars.CLOUDFLARE_WORKER_SUBDOMAIN || secrets.CLOUDFLARE_WORKER_SUBDOMAIN }}
          TF_VAR_r2_media_location: "${{ vars.R2_MEDIA_LOCATION || secrets.R2_MEDIA_LOCATION || 'ENAM' }}"
          TF_VAR_r2_media_bucket_name: ${{ vars.R2_MEDIA_BUCKET_NAME || secrets.R2_MEDIA_BUCKET_NAME }}
          TF_VAR_vercel_api_token: "${{ secrets.VERCEL_API_TOKEN || '000000000000000000000000' }}"
          TF_VAR_vercel_team_id: "${{ vars.VERCEL_TEAM_ID || secrets.VERCEL_TEAM_ID || 'unused' }}"
          TF_VAR_modal_token_id: ${{ secrets.MODAL_TOKEN_ID }}
          TF_VAR_modal_token_secret: ${{ secrets.MODAL_TOKEN_SECRET }}
          TF_VAR_modal_workspace: ${{ vars.MODAL_WORKSPACE || secrets.MODAL_WORKSPACE }}
          TF_VAR_modal_environment: "${{ vars.MODAL_ENVIRONMENT || secrets.MODAL_ENVIRONMENT || 'main' }}"
          TF_VAR_modal_environment_web_suffix: ${{ vars.MODAL_ENVIRONMENT_WEB_SUFFIX || secrets.MODAL_ENVIRONMENT_WEB_SUFFIX }}
          TF_VAR_modal_api_secret: ${{ secrets.MODAL_API_SECRET }}
          TF_VAR_enable_slack_bot: "${{ vars.ENABLE_SLACK_BOT || secrets.ENABLE_SLACK_BOT || 'true' }}"
          TF_VAR_enable_github_bot: "${{ vars.ENABLE_GITHUB_BOT || secrets.ENABLE_GITHUB_BOT || 'false' }}"
          TF_VAR_enable_linear_bot: "${{ vars.ENABLE_LINEAR_BOT || secrets.ENABLE_LINEAR_BOT || 'false' }}"
          TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_provider_accounts_encryption_key: ${{ secrets.PROVIDER_ACCOUNTS_ENCRYPTION_KEY }}
          TF_VAR_deployment_name: ${{ vars.DEPLOYMENT_NAME || secrets.DEPLOYMENT_NAME }}
          TF_VAR_app_name: "${{ vars.APP_NAME || secrets.APP_NAME || 'Open-Inspect' }}"
          TF_VAR_app_icon_url: ${{ vars.APP_ICON_URL || secrets.APP_ICON_URL }}
          TF_VAR_web_platform: "${{ vars.WEB_PLATFORM || secrets.WEB_PLATFORM || 'vercel' }}"
          TF_VAR_web_serverless_region: "${{ vars.WEB_SERVERLESS_REGION || 'iad1' }}"
          TF_VAR_sandbox_provider: "${{ vars.SANDBOX_PROVIDER || secrets.SANDBOX_PROVIDER || 'modal' }}"
          TF_VAR_daytona_api_url: ${{ vars.DAYTONA_API_URL || secrets.DAYTONA_API_URL }}
          TF_VAR_daytona_api_key: ${{ secrets.DAYTONA_API_KEY }}
          TF_VAR_daytona_base_snapshot: ${{ vars.DAYTONA_BASE_SNAPSHOT || secrets.DAYTONA_BASE_SNAPSHOT }}
          TF_VAR_daytona_base_snapshot_memory_gib: "${{ vars.DAYTONA_BASE_SNAPSHOT_MEMORY_GIB || '2' }}"
          TF_VAR_daytona_target: ${{ vars.DAYTONA_TARGET || secrets.DAYTONA_TARGET }}
          TF_VAR_vercel_sandbox_token: ${{ secrets.VERCEL_SANDBOX_TOKEN }}
          TF_VAR_vercel_sandbox_project_id: ${{ vars.VERCEL_SANDBOX_PROJECT_ID || secrets.VERCEL_SANDBOX_PROJECT_ID }}
          TF_VAR_vercel_sandbox_team_id: ${{ vars.VERCEL_SANDBOX_TEAM_ID || secrets.VERCEL_SANDBOX_TEAM_ID }}
          TF_VAR_vercel_sandbox_api_base_url: ${{ vars.VERCEL_SANDBOX_API_BASE_URL || secrets.VERCEL_SANDBOX_API_BASE_URL }}
          TF_VAR_vercel_base_snapshot_id: ${{ vars.VERCEL_BASE_SNAPSHOT_ID || secrets.VERCEL_BASE_SNAPSHOT_ID }}
          TF_VAR_vercel_sandbox_runtime: "${{ vars.VERCEL_SANDBOX_RUNTIME || secrets.VERCEL_SANDBOX_RUNTIME || 'node24' }}"
          TF_VAR_e2b_api_key: ${{ secrets.E2B_API_KEY }}
          TF_VAR_e2b_template_id: ${{ vars.E2B_TEMPLATE_ID || secrets.E2B_TEMPLATE_ID }}
          TF_VAR_e2b_api_url: "${{ vars.E2B_API_URL || secrets.E2B_API_URL || 'https://api.e2b.app' }}"
          TF_VAR_e2b_template_cpu: "${{ vars.E2B_TEMPLATE_CPU || secrets.E2B_TEMPLATE_CPU || '2' }}"
          TF_VAR_e2b_template_memory_mb: "${{ vars.E2B_TEMPLATE_MEMORY_MB || secrets.E2B_TEMPLATE_MEMORY_MB || '4096' }}"
          TF_VAR_boat_api_key: ${{ secrets.BOAT_API_KEY }}
          TF_VAR_boat_api_url: "${{ vars.BOAT_API_URL || secrets.BOAT_API_URL || 'https://boat.dev/api/v1' }}"
          TF_VAR_boat_base_snapshot: ${{ vars.BOAT_BASE_SNAPSHOT || secrets.BOAT_BASE_SNAPSHOT }}
          TF_VAR_boat_org: ${{ vars.BOAT_ORG || secrets.BOAT_ORG }}
          # Documentation site (packages/docs). Leaving DOCS_SITE_ENABLED unset
          # after provisioning the site destroys its Vercel project on apply.
          TF_VAR_docs_site_enabled: "${{ vars.DOCS_SITE_ENABLED || secrets.DOCS_SITE_ENABLED || 'false' }}"
          TF_VAR_docs_custom_domain: ${{ vars.DOCS_CUSTOM_DOMAIN || secrets.DOCS_CUSTOM_DOMAIN }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

      - name: Post Apply Results
        if: always()
        run: |
          echo "### Terraform Apply Results"
          echo "Status: ${{ job.status }}"
          echo "Commit: ${{ github.sha }}"
          echo "Environment: ${{ inputs.environment }}"
          echo "Applied by: ${{ github.actor }}"
