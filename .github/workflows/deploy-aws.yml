# Deploys the control-plane image to an AWS instance; deploy-aws-image.yml does
# the work, rolling back if the new image does not come up.
name: Deploy (AWS)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub environment to deploy"
        type: choice
        options:
          - aws-staging
          - aws-production
        default: aws-staging
  push:
    branches: [main]
    paths:
      # What the control-plane image is built from.
      - "packages/control-plane/**"
      - "packages/shared/**"
      - "packages/sandbox-runtime/src/sandbox_runtime/*.json"
      - "terraform/d1/migrations/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/deploy-aws.sh"
      - ".github/workflows/deploy-aws.yml"
      - ".github/workflows/deploy-aws-image.yml"

permissions: {}

jobs:
  deploy:
    name: Deploy
    # An installation that has configured no AWS environment skips the whole
    # workflow rather than spending a runner to discover it has nothing to do.
    # `vars` is readable here, which is the only reason this can be decided
    # before a job starts -- `on:` has no access to it.
    if: inputs.environment != '' || vars.AWS_DEPLOY_ON_PUSH_ENVIRONMENT != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-aws-image.yml
    with:
      environment: ${{ inputs.environment || vars.AWS_DEPLOY_ON_PUSH_ENVIRONMENT }}
      image: control-plane
